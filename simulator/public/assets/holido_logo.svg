<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#0A192F"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="speedGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- ICON BADGE -->
  <g transform="translate(6, 6)">
    <!-- Squircle Background -->
    <rect x="0" y="0" width="48" height="48" rx="14" fill="url(#bgGrad)" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.75"/>
    
    <!-- Motion Speed Lines -->
    <path d="M 7 16 L 15 16" stroke="url(#speedGrad)" stroke-width="2" stroke-linecap="round"/>
    <path d="M 5 24 L 13 24" stroke="url(#speedGrad)" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 8 32 L 15 32" stroke="url(#speedGrad)" stroke-width="2" stroke-linecap="round"/>

    <!-- Slanted Emblem 'H' with Speed Wing -->
    <!-- Left Stem -->
    <path d="M 16 36 L 20 12 C 20.2 11.2 21.2 10.8 22 11.1 C 22.8 11.4 23.2 12.3 23 13.1 L 19.3 35.1 C 19.1 35.9 18.2 36.4 17.3 36.1 C 16.5 35.8 15.9 34.9 16.2 34 Z" fill="url(#cyanGrad)"/>
    
    <!-- Right Stem -->
    <path d="M 28 36 L 32 12 C 32.2 11.2 33.2 10.8 34 11.1 C 34.8 11.4 35.2 12.3 35 13.1 L 31.3 35.1 C 31.1 35.9 30.2 36.4 29.3 36.1 C 28.5 35.8 27.9 34.9 28.2 34 Z" fill="url(#cyanGrad)"/>

    <!-- Dynamic Forward Arrow Bridge -->
    <path d="M 18 25 L 36 21 L 27 27 L 38 23 L 29 30 L 25 27 Z" fill="url(#goldGrad)" filter="url(#glow)"/>

    <!-- Forward Precision Point -->
    <circle cx="38" cy="23" r="2.5" fill="#FFFFFF" filter="url(#glow)"/>
  </g>

  <!-- TYPOGRAPHY WORDMARK -->
  <g transform="translate(64, 34)">
    <text font-family="'Plus Jakarta Sans', 'Segoe UI', -apple-system, sans-serif" font-weight="900" font-size="26" letter-spacing="0.5">
      <tspan fill="#FFFFFF">HOLI</tspan><tspan fill="#38BDF8">DO</tspan>
    </text>
  </g>

  <!-- SUBTITLE TAGLINE -->
  <g transform="translate(65, 48)">
    <text font-family="'Plus Jakarta Sans', 'Segoe UI', -apple-system, sans-serif" font-weight="700" font-size="8.5" fill="#93C5FD" letter-spacing="2.8">
      BIKE TAXI • PARCEL
    </text>
  </g>
</svg>
